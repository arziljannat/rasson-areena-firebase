name: Rasson Snapshot Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply snapshot and frame-count fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          js = Path('frontend/scripts/tables.js')
          s = js.read_text()

          # Central frame-unit rule: Single=1, Double=2, Century=0 frames.
          marker = '// =====================================================\n// 🎱 FRAME COUNTS\n// ====================================================='
          helper = '''// =====================================================\n// 🎱 RASSON FRAME UNIT COUNT\n// Single Frame = 1 | Double Frame = 2 | Century = 0\n// =====================================================\nfunction getFrameUnitCount(h) {\n\n    const type = String(\n        h.playType ??\n        h.selectedPlayType ??\n        h.play_type ??\n        h.selected_play_type ??\n        ""\n    ).toLowerCase();\n\n    const rate = Number(\n        h.selectedRate ??\n        h.selected_rate ??\n        h.frameRate ??\n        h.frame_rate ??\n        0\n    );\n\n    if (type.includes("century")) return 0;\n    if (rate === 200 || type.includes("double")) return 2;\n    return 1;\n}\n\nfunction countFrameUnits(list) {\n    return (list || []).reduce(\n        (sum, h) => sum + getFrameUnitCount(h),\n        0\n    );\n}\n\n'''
          if 'function getFrameUnitCount(h)' not in s:
              if marker not in s:
                  raise SystemExit('Frame count marker not found')
              s = s.replace(marker, helper + marker, 1)

          replacements = {
              'const s1FrameCount =\n    shift1Frames.length;': 'const s1FrameCount =\n    countFrameUnits(shift1Frames);',
              'const s2FrameCount =\n    shift2Frames.length;': 'const s2FrameCount =\n    countFrameUnits(shift2Frames);',
              'const s1PaidFrameCount =\n    shift1PaidFrames.length;': 'const s1PaidFrameCount =\n    countFrameUnits(shift1PaidFrames);',
              'const s2PaidFrameCount =\n    shift2PaidFrames.length;': 'const s2PaidFrameCount =\n    countFrameUnits(shift2PaidFrames);',
              'const s1UnpaidFrameCount =\n    shift1UnpaidFrames.length;': 'const s1UnpaidFrameCount =\n    countFrameUnits(shift1UnpaidFrames);',
              'const s2UnpaidFrameCount =\n    shift2UnpaidFrames.length;': 'const s2UnpaidFrameCount =\n    countFrameUnits(shift2UnpaidFrames);'
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)

          # Snapshot table Double Frame = 2 instead of one history record = 1.
          old = '''        } else {\n\n            frames++;\n            frameAmount += amount;\n            frameTime += seconds;\n\n        }'''
          new = '''        } else {\n\n            frames += getFrameUnitCount(h);\n            frameAmount += amount;\n            frameTime += seconds;\n\n        }'''
          if old in s:
              s = s.replace(old, new, 1)

          # Replace Snapshot Overall section with accounting-friendly 5 cards.
          start = s.find('    /* =================================================\n       OVERALL\n    ================================================= */', s.find('function buildRassonSnapshot'))
          end = s.find('    /* =================================================\n       OPEN / CLOSE TIME\n    ================================================= */', start)
          if start < 0 or end < 0:
              raise SystemExit('Snapshot overall section not found')

          overall = '''    /* =================================================\n       OVERALL — ACCOUNTING SUMMARY\n    ================================================= */\n\n    const totalIncome = Number(accounting.gameCollection || 0);\n    const totalDiscount = Number(accounting.discount || 0);\n    const totalExpense = Number(accounting.expenses || 0);\n    const totalEasypaisa = Number(accounting.easypaisa || 0);\n    const totalClosingCash = Number(accounting.closingCash || 0);\n\n    html += `\n\n    <div class="snapshot-section-title">\n        📊 OVERALL SUMMARY\n    </div>\n\n    <div class="snapshot-overall">\n\n        <div class="snapshot-overall-card income-total">\n            <div class="snapshot-overall-title">💰 TOTAL INCOME</div>\n            <strong>${snapshotMoney(totalIncome)}</strong>\n        </div>\n\n        <div class="snapshot-overall-card discount-total">\n            <div class="snapshot-overall-title">🎁 DISCOUNT</div>\n            <strong>${snapshotMoney(totalDiscount)}</strong>\n        </div>\n\n        <div class="snapshot-overall-card expense-total">\n            <div class="snapshot-overall-title">💸 EXPENSE</div>\n            <strong>${snapshotMoney(totalExpense)}</strong>\n        </div>\n\n        <div class="snapshot-overall-card easypaisa-total">\n            <div class="snapshot-overall-title">📲 EASYPAISA</div>\n            <strong>${snapshotMoney(totalEasypaisa)}</strong>\n        </div>\n\n        <div class="snapshot-overall-card cash-total">\n            <div class="snapshot-overall-title">💵 CLOSING CASH</div>\n            <strong>${snapshotMoney(totalClosingCash)}</strong>\n        </div>\n\n    </div>\n\n    `;\n\n'''
          s = s[:start] + overall + s[end:]
          js.write_text(s)

          # CSS override: the file has several legacy snapshot blocks; keep them intact,
          # but make the new card markup win without touching other page styling.
          css = Path('frontend/styles/tables-clean-final.css')
          if css.exists():
              c = css.read_text()
              block = r'''\n/* ============================================================\n   🔥 RASSON SNAPSHOT — FINAL CARD LAYOUT\n   Accounting: Income / Discount / Expense / EasyPaisa / Cash\n============================================================ */\n#shiftSummaryPopup .snapshot-table-card {\n    width: 100% !important;\n    margin: 0 0 18px !important;\n    padding: 18px !important;\n    box-sizing: border-box !important;\n    border: 2px solid #00ff99 !important;\n    border-radius: 18px !important;\n    background: rgba(0,0,0,.78) !important;\n    box-shadow: 0 0 15px rgba(0,255,150,.35) !important;\n}\n#shiftSummaryPopup .snapshot-table-title {\n    text-align: center !important;\n    font-size: 25px !important;\n    font-weight: 900 !important;\n    color: #fff !important;\n    margin-bottom: 12px !important;\n}\n#shiftSummaryPopup .snapshot-game-row {\n    display: grid !important;\n    grid-template-columns: 1.25fr 1fr 1fr 1.1fr !important;\n    gap: 10px !important;\n    align-items: center !important;\n    padding: 12px !important;\n    margin-top: 10px !important;\n    border-radius: 12px !important;\n    background: rgba(0,0,0,.55) !important;\n}\n#shiftSummaryPopup .snapshot-game-type {\n    font-size: 18px !important;\n    font-weight: 900 !important;\n    color: #00ffcc !important;\n}\n#shiftSummaryPopup .century-row .snapshot-game-type { color: #ffd700 !important; }\n#shiftSummaryPopup .snapshot-stat {\n    display: flex !important;\n    flex-direction: column !important;\n    align-items: center !important;\n    justify-content: center !important;\n}\n#shiftSummaryPopup .snapshot-stat span {\n    font-size: 12px !important;\n    color: #aaa !important;\n    font-weight: 700 !important;\n}\n#shiftSummaryPopup .snapshot-stat strong {\n    font-size: 20px !important;\n    color: #fff !important;\n    font-weight: 900 !important;\n}\n#shiftSummaryPopup .snapshot-rooms {\n    display: grid !important;\n    grid-template-columns: repeat(3, minmax(0,1fr)) !important;\n    gap: 15px !important;\n}\n#shiftSummaryPopup .snapshot-room-card {\n    padding: 18px !important;\n    text-align: center !important;\n    border: 2px solid #00ffff !important;\n    border-radius: 15px !important;\n    background: rgba(0,20,25,.75) !important;\n}\n#shiftSummaryPopup .snapshot-room-name {\n    font-size: 19px !important;\n    font-weight: 900 !important;\n    color: #00ffcc !important;\n}\n#shiftSummaryPopup .snapshot-room-amount {\n    margin-top: 8px !important;\n    font-size: 23px !important;\n    font-weight: 900 !important;\n    color: #fff !important;\n}\n#shiftSummaryPopup .snapshot-overall {\n    display: grid !important;\n    grid-template-columns: repeat(5, minmax(0,1fr)) !important;\n    gap: 12px !important;\n}\n#shiftSummaryPopup .snapshot-overall-card {\n    min-width: 0 !important;\n    padding: 18px 12px !important;\n    text-align: center !important;\n    border: 2px solid #00ff99 !important;\n    border-radius: 16px !important;\n    background: rgba(0,0,0,.75) !important;\n}\n#shiftSummaryPopup .snapshot-overall-title {\n    font-size: 16px !important;\n    font-weight: 900 !important;\n    color: #00ffcc !important;\n    margin-bottom: 8px !important;\n}\n#shiftSummaryPopup .snapshot-overall-card strong {\n    display: block !important;\n    font-size: 24px !important;\n    font-weight: 900 !important;\n    color: #fff !important;\n}\n#shiftSummaryPopup .discount-total { border-color: #ff66cc !important; }\n#shiftSummaryPopup .expense-total { border-color: #ff5555 !important; }\n#shiftSummaryPopup .easypaisa-total { border-color: #00ffff !important; }\n#shiftSummaryPopup .cash-total { border-color: #ffd700 !important; }\n#shiftSummaryPopup .cash-total .snapshot-overall-title { color: #ffd700 !important; }\n@media (max-width: 900px) {\n    #shiftSummaryPopup .snapshot-overall { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }\n    #shiftSummaryPopup .snapshot-game-row { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }\n    #shiftSummaryPopup .snapshot-game-type { grid-column: 1 / -1 !important; text-align: center !important; }\n    #shiftSummaryPopup .snapshot-rooms { grid-template-columns: 1fr !important; }\n}\n'''
              if 'RASSON SNAPSHOT — FINAL CARD LAYOUT' not in c:
                  css.write_text(c + block)

          print('Applied Rasson snapshot fixes')
          PY

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/scripts/tables.js frontend/styles/tables-clean-final.css
          git commit -m 'fix: correct frame units and shift snapshot accounting' || true
          git rm .github/workflows/rasson-snapshot-fix.yml || true
          git commit -m 'chore: remove temporary snapshot fix workflow' || true
          git push