<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Revenue Report – Rasson Snooker Academy</title>

    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/mobile.css">
    <link rel="stylesheet" href="../styles/reports.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar-container"></div>

    <script src="../scripts/load-navbar.js"></script>
    <script src="../scripts/navbar.js"></script>


    <!-- REPORT PAGE -->
    <main class="report-main">

        <!-- REPORT MENU - NAVBAR KE NEECHE -->
        <aside class="report-sidebar">

            <h2 class="sidebar-title">📊 Reports</h2>

            <div class="report-menu">

                <button class="report-btn active">
                    🎮 Game Income Report
                </button>

                <button class="report-btn">
                    🍔 Canteen Income Report
                </button>

                <button class="report-btn">
                    📦 Inventory Report
                </button>

            </div>

        </aside>


        <!-- BRANCH INCOME REPORT -->
        <section class="report-content">

            <div class="report-panel">

                <div class="report-header">
                    <h1>Branch Income Report</h1>
                    <p>Select date range to generate report</p>
                </div>


                <!-- FILTER -->
                <div class="filter-row">

                    <div class="date-box">
                        <label>From</label>
                        <input type="date" id="fromDate">
                    </div>

                    <div class="date-box">
                        <label>To</label>
                        <input type="date" id="toDate">
                    </div>

                    <button id="viewReportBtn" class="generate-btn">
                        Generate Report
                    </button>

                    <button id="printReportBtn" class="print-btn">
                        🖨️ Print Report
                    </button>

                </div>


                <div class="report-divider"></div>


                <!-- RESULT -->
                <div id="reportOutput" class="output-box">

                    <div class="empty-report">
                        Select date range and click
                        <b>Generate Report</b>.
                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- JS -->
    <script type="module" src="../scripts/firebase-config.js"></script>
    <script type="module" src="../scripts/reports.js"></script>

</body>
</html>
